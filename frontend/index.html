<html lang="en">

    <meta charset="UTF-8" />

    <title>Steel Recon — My Home Group</title>
    <script>
      // Force light mode — dark mode is not supported in v1.
      // Remove any stale "dark" class from prior visits or OS preference.

        document.documentElement.classList.remove("dark");
        localStorage.removeItem("theme");
      } catch {}
    </script>

    <script type="module" src="/src/main.tsx"></script>
